<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CRO-AI · Backoffice</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#14171f;--mute:#6b7280;--line:#e4e7ec;--accent:#2f5bea;--ok:#12805c;--warn:#a15c00;--bad:#b42318;--chip:#eef1f6}
@media (prefers-color-scheme:dark){:root{--bg:#0e1116;--card:#171b22;--ink:#e8ebf0;--mute:#98a1b0;--line:#2a303b;--accent:#7b9bff;--ok:#4cc79b;--warn:#f0b24a;--bad:#ff8a80;--chip:#222833}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 24px;padding:12px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:16px;margin:0}nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{font:inherit;background:none;border:0;padding:6px 12px;border-radius:8px;cursor:pointer;color:var(--mute)}
nav button.on{background:var(--chip);color:var(--ink);font-weight:600}
.right{margin-left:auto;color:var(--mute);font-size:12px;display:flex;gap:10px;align-items:center}
main{max-width:1200px;margin:0 auto;padding:20px 16px 60px}
h2{font-size:15px;margin:26px 0 10px}h2:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.kpi .v{font-size:26px;font-weight:650;letter-spacing:-.02em}.kpi .l{color:var(--mute);font-size:12px}
.tablewrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%}th,td{padding:8px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top;white-space:nowrap}
th{font-size:12px;color:var(--mute);font-weight:600;background:var(--card)}tr:last-child td{border-bottom:0}td.wrap{white-space:normal;min-width:220px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:1px 9px;font-size:12px;margin:1px 3px 1px 0}
.chip.ok{color:var(--ok)}.chip.warn{color:var(--warn)}.chip.bad{color:var(--bad)}.chip.lever{background:var(--accent);color:#fff}
.mute{color:var(--mute)}.small{font-size:12px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:12px}
button.btn{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:5px 11px;border-radius:8px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}button.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.switch{width:38px;height:22px;border-radius:99px;background:var(--line);border:0;position:relative;cursor:pointer;padding:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.15s}
.switch.on{background:var(--ok)}.switch.on::after{left:19px}
input,select{font:inherit;background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.form{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));padding:6px 0}
.form label{display:grid;gap:3px;font-size:12px;color:var(--mute)}.form input{width:100%}
.bar{height:10px;border-radius:5px;background:var(--accent);min-width:2px}.barbg{background:var(--chip);border-radius:5px;width:100%}
.banner{border:1px solid var(--line);border-left:4px solid var(--warn);background:var(--card);padding:10px 14px;border-radius:8px;margin-bottom:14px}
.banner.real{border-left-color:var(--ok)}.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.err{color:var(--bad)}a.lnk{color:var(--accent);cursor:pointer;text-decoration:underline}
</style>
</head>
<body>
<header>
  <h1>CRO-AI · Backoffice</h1>
  <nav id="nav"></nav>
  <div class="right"><span id="updated"></span><button class="btn" id="refresh">Actualizar</button></div>
</header>
<main id="view"></main>
<script>
'use strict';
// ---------- utilidades (todo el contenido dinámico entra por textContent: los eventos vienen de internet) ----------
function h(tag, attrs) {
  var n = document.createElement(tag);
  Object.keys(attrs || {}).forEach(function (k) {
    if (k === 'class') n.className = attrs[k];
    else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else if (attrs[k] !== false && attrs[k] != null) n.setAttribute(k, attrs[k]);
  });
  for (var i = 2; i < arguments.length; i++) add(n, arguments[i]);
  return n;
}
function add(n, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) c.forEach(function (x) { add(n, x); });
  else n.appendChild(c.nodeType ? c : document.createTextNode(String(c)));
}
var pct = function (x) { return x == null ? '—' : (x * 100).toFixed(1) + '%'; };
var num = function (x) { return x == null ? '—' : Number(x).toLocaleString('es-ES'); };
var when = function (ts) { return ts ? new Date(ts * 1000).toLocaleString('es-ES') : '—'; };
var LABEL = {
  page_view_product: 'ver ficha de producto', add_to_cart: 'añadir al carrito', view_cart: 'ver carrito', begin_checkout: 'iniciar checkout',
  add_payment_info: 'introducir pago', purchase: 'comprar', view_reviews: 'leer reseñas', view_shipping_info: 'consultar envío',
  view_size_guide: 'ver guía de tallas', add_to_wishlist: 'guardar en favoritos', search: 'usar el buscador', apply_coupon: 'aplicar cupón',
  page_view_home: 'ver home', page_view_category: 'ver categoría', page_view_cart: 'página carrito', page_view_checkout: 'página checkout',
  page_view_confirmation: 'página confirmación'
};
var lab = function (e) { return LABEL[e] || e; };
var PAGE = { product: 'Producto', cart: 'Carrito', checkout: 'Checkout', home: 'Home', category: 'Categoría', search: 'Búsqueda' };

async function api(path, body) {
  var opt = { credentials: 'same-origin' };
  if (body) opt = { method: 'POST', credentials: 'same-origin', headers: { 'X-CRO-Admin': '1', 'content-type': 'application/json' }, body: JSON.stringify(body) };
  var r = await fetch(path, opt);
  var data = await r.json().catch(function () { return {}; });
  if (!r.ok) throw new Error(data.error || ('Error ' + r.status));
  return data;
}
function kpi(label, value, sub) { return h('div', { class: 'card kpi' }, h('div', { class: 'v' }, value), h('div', { class: 'l' }, label), sub ? h('div', { class: 'l' }, sub) : null); }
function table(head, rows, numCols) {
  numCols = numCols || [];
  return h('div', { class: 'tablewrap' }, h('table', {},
    h('thead', {}, h('tr', {}, head.map(function (t, i) { return h('th', { class: numCols.indexOf(i) >= 0 ? 'num' : '' }, t); }))),
    h('tbody', {}, rows)));
}
function td(content, cls) { return h('td', { class: cls || '' }, content); }
function empty(msg) { return h('div', { class: 'card empty' }, msg); }
function verdictChip(v) {
  if (!v) return h('span', { class: 'mute' }, '—');
  var cls = v.indexOf('mejora') === 0 ? 'ok' : (v.indexOf('empeora') === 0 ? 'bad' : 'warn');
  return h('span', { class: 'chip ' + cls }, v);
}
function describeTrigger(t) {
  var p = [];
  var pages = [].concat(t.page_type || []).map(function (x) { return PAGE[x] || x; });
  if (pages.length) p.push(pages.join('/'));
  if (t.exit_intent) p.push('al intentar salir'); else if (t.after_seconds) p.push('tras ' + t.after_seconds + ' s');
  if (t.missing_event) p.push('si no ha hecho «' + lab(t.missing_event) + '»');
  if (t.has_event) p.push('con «' + lab(t.has_event) + '» hecho');
  if (t.min_product_views) p.push('≥' + t.min_product_views + ' productos vistos');
  return p.join(' · ');
}

// ---------- vistas ----------
var views = {};
var editing = false;

views.resumen = async function (root) {
  var o = await api('/admin/api/overview');
  if (!o.events) { root.appendChild(empty('Aún no hay registros. Navega por la tienda con el widget instalado y vuelve a actualizar.')); return; }
  var e = o.experiment, t = e.treatment, c = e.control;
  root.appendChild(h('h2', {}, 'Actividad'));
  root.appendChild(h('div', { class: 'grid' },
    kpi('Sesiones', num(o.sessions)), kpi('Compras', num(o.buyers)), kpi('Tasa de conversión', pct(o.conversion_rate)),
    kpi('Ingresos', num(o.revenue)), kpi('Veces que se mostró una herramienta', num(o.tool_impressions), num(o.tool_eligible) + ' veces elegibles'),
    kpi('Eventos registrados', num(o.events), 'último: ' + when(o.last_event_ts))));
  root.appendChild(h('h2', {}, 'Efecto de las herramientas CRO (tratamiento vs. control)'));
  if (!o.holdout_pct) {
    root.appendChild(h('div', { class: 'banner' }, 'No hay grupo de control (holdout 0 %): no se puede medir el efecto real. Arranca con --holdout 10 para reservar un 10 % de sesiones sin nudges.'));
  } else if (!t.sessions && !c.sessions) {
    root.appendChild(h('div', { class: 'banner' }, 'Todavía no hay sesiones elegibles. Holdout configurado: ' + o.holdout_pct + ' %.'));
  } else {
    root.appendChild(h('div', { class: 'grid' },
      kpi('Conversión con herramientas', pct(t.conversion_rate), num(t.sessions) + ' sesiones'),
      kpi('Conversión del control', pct(c.conversion_rate), num(c.sessions) + ' sesiones'),
      kpi('Mejora relativa', e.relative_uplift == null ? '—' : (e.relative_uplift * 100).toFixed(1) + '%', 'p = ' + e.p_value),
      h('div', { class: 'card' }, h('div', { class: 'l' }, 'Veredicto'), h('div', { style: 'margin-top:8px' }, verdictChip(e.verdict)))));
    root.appendChild(h('p', { class: 'mute small' }, 'Solo se comparan sesiones en las que alguna herramienta habría saltado, en ambos grupos. El veredicto exige ≥ 200 sesiones por grupo.'));
  }
};

views.herramientas = async function (root) {
  var d = await api('/admin/api/tools');
  root.appendChild(h('h2', {}, 'Herramientas CRO'));
  root.appendChild(h('p', { class: 'mute small' }, 'Cuántas veces ha aparecido cada una y cómo se comporta. Holdout: ' + (d.holdout_pct || 0) + ' %. Los cambios se aplican al widget en la siguiente carga de página.'));
  if (!d.tools.length) { root.appendChild(empty('No hay herramientas generadas. Ejecuta `cro-ai generate`.')); return; }
  var rows = [];
  d.tools.forEach(function (t) {
    var ex = t.experiment;
    var formRow = null;
    var inputs = {};
    function field(key, label, max) {
      inputs[key] = h('input', { value: t.content[key], maxlength: max });
      return h('label', {}, label + ' (máx. ' + max + ')', inputs[key]);
    }
    var msg = h('span', { class: 'small' });
    var form = h('div', { class: 'form' }, field('title', 'Título', 45), field('body', 'Texto', 140), field('cta', 'Botón', 28),
      h('div', {}, h('button', { class: 'btn primary', onclick: async function () {
        try {
          await api('/admin/api/tools/' + encodeURIComponent(t.id), { title: inputs.title.value, body: inputs.body.value, cta: inputs.cta.value });
          editing = false; render();
        } catch (e) { msg.className = 'small err'; msg.textContent = e.message; }
      } }, 'Guardar'), ' ', h('button', { class: 'btn', onclick: function () { editing = false; formRow.remove(); } }, 'Cancelar'), ' ', msg));
    formRow = h('tr', {}, h('td', { colspan: 10, class: 'wrap' }, h('div', { class: 'small mute' }, 'Edita el texto que ve el visitante. Revisa que no prometa nada que la tienda no ofrezca.'), form));
    var sw = h('button', { class: 'switch' + (t.enabled ? ' on' : ''), title: t.enabled ? 'Activa: pulsa para desactivar' : 'Desactivada', 'aria-pressed': String(t.enabled),
      onclick: async function () { await api('/admin/api/tools/' + encodeURIComponent(t.id), { enabled: !t.enabled }); render(); } });
    rows.push(h('tr', {},
      td(t.priority),
      h('td', { class: 'wrap' }, h('b', {}, t.content.title), h('div', { class: 'mute small' }, t.content.body),
        h('div', {}, h('span', { class: 'chip mono' }, t.id), h('span', { class: 'chip' }, t.stage || ''),
          h('span', { class: 'chip' }, 'copy: ' + t.copy_source), t.claims_verified ? null : h('span', { class: 'chip warn' }, 'copy sin verificar')),
        h('div', { class: 'mute small' }, describeTrigger(t.trigger))),
      td(sw), td(num(t.eligible), 'num'), td(num(t.impressions), 'num'), td(num(t.clicks), 'num'), td(pct(t.ctr), 'num'), td(num(t.dismissals), 'num'),
      h('td', { class: 'wrap' }, ex && (ex.treatment.sessions || ex.control.sessions) ?
        [h('div', {}, pct(ex.treatment.conversion_rate) + ' vs ' + pct(ex.control.conversion_rate)), h('div', {}, verdictChip(ex.verdict))] : h('span', { class: 'mute' }, 'sin datos')),
      td(h('button', { class: 'btn', onclick: function () {
        if (formRow.parentNode) return; editing = true; var tr = this.closest('tr'); tr.parentNode.insertBefore(formRow, tr.nextSibling);
      } }, 'Editar'))));
  });
  root.appendChild(table(['#', 'Herramienta', 'Activa', 'Elegible', 'Mostrada', 'Clics', 'CTR', 'Descartes', 'Conv. trat. vs control', ''], rows, [3, 4, 5, 6, 7]));
  if (d.gaps.length) {
    root.appendChild(h('h2', {}, 'Oportunidades que la tienda aún no cubre'));
    d.gaps.forEach(function (g) { root.appendChild(h('div', { class: 'banner' }, g.message)); });
  }
};

views.informe = async function (root) {
  var r = (await api('/admin/api/report')).report;
  if (!r) { root.appendChild(empty('No hay informe. Ejecuta `cro-ai analyze` (o `cro-ai demo-store`).')); return; }
  var kind = (r.data_source || {}).kind;
  var msg = kind === 'simulated' ? 'Datos SIMULADOS: el informe viene de tráfico sintético, no de clientes reales. Sirve para probar el sistema.'
    : kind === 'real' ? 'Datos reales (' + num(r.summary.sessions) + ' sesiones).'
    : 'Origen de los datos no indicado (informe antiguo): no asumas que son reales. Vuelve a generarlo con `cro-ai analyze`.';
  root.appendChild(h('div', { class: 'banner' + (kind === 'real' ? ' real' : '') }, msg));
  var s = r.summary;
  root.appendChild(h('div', { class: 'grid' }, kpi('Sesiones analizadas', num(s.sessions)), kpi('Compras', num(s.buyers)), kpi('Conversión', pct(s.conversion_rate)), kpi('Ingresos', num(s.revenue))));
  root.appendChild(h('h2', {}, 'Viaje ideal detectado'));
  root.appendChild(h('div', { class: 'card' }, r.ideal_journey.map(function (j, i) {
    return [i ? ' → ' : '', h('span', { class: 'chip' + (j.kind === 'lever' ? ' lever' : '') }, lab(j.event))];
  }), h('div', { class: 'mute small', style: 'margin-top:8px' }, 'Resaltados: comportamientos que distinguen a quien compra (palancas). Ordenados por su posición típica en las sesiones que compran.')));
  root.appendChild(h('h2', {}, 'Qué hace la gente que compra'));
  root.appendChild(table(['Comportamiento', 'Etapa', 'Sesiones', 'Conv. con', 'Conv. sin', 'Odds ratio ajustado', 'p', 'Significativo'],
    r.drivers.map(function (d) {
      return h('tr', {}, td(lab(d.event)), td(d.stage === 'browse' ? 'antes del carrito' : 'en el carrito'), td(num(d.sessions_with), 'num'), td(pct(d.cr_with), 'num'), td(pct(d.cr_without), 'num'),
        td(d.adj_odds_ratio != null ? d.adj_odds_ratio : d.odds_ratio, 'num'), td(d.p_value, 'num'), td(h('span', { class: 'chip ' + (d.significant ? 'ok' : '') }, d.significant ? 'sí' : 'no')));
    }), [2, 3, 4, 5, 6]));
  root.appendChild(h('p', { class: 'mute small' }, 'El odds ratio ajustado controla por el resto de comportamientos y por dispositivo. Asociación no es causalidad: por eso hay grupo de control.'));
  root.appendChild(h('h2', {}, 'Dónde se pierde la gente'));
  var top = Math.max.apply(null, r.funnel.map(function (f) { return f.sessions; })) || 1;
  root.appendChild(h('div', { class: 'card' }, r.funnel.map(function (f) {
    return h('div', { style: 'display:grid;grid-template-columns:170px 1fr 130px;gap:10px;align-items:center;margin:6px 0' },
      h('span', {}, lab(f.step)), h('div', { class: 'barbg' }, h('div', { class: 'bar', style: 'width:' + (f.sessions / top * 100) + '%' })),
      h('span', { class: 'small mute' }, num(f.sessions) + ' · ' + pct(f.pct_of_previous) + ' del paso anterior'));
  })));
  if (r.patterns.length) {
    root.appendChild(h('h2', {}, 'Secuencias con más conversión'));
    root.appendChild(table(['Secuencia', 'Sesiones', 'Conversión', 'Veces la media'], r.patterns.map(function (p) {
      return h('tr', {}, td(p.pattern.map(lab).join(' → ')), td(num(p.sessions), 'num'), td(pct(p.conversion_rate), 'num'), td('x' + p.lift_vs_average, 'num'));
    }), [1, 2, 3]));
  }
  root.appendChild(h('h2', {}, 'Segmentos'));
  var seg = h('div', { class: 'grid' });
  [['device', 'Dispositivo'], ['source', 'Origen']].forEach(function (k) {
    seg.appendChild(h('div', {}, h('div', { class: 'small mute', style: 'margin-bottom:4px' }, k[1]),
      table(['', 'Sesiones', 'Conversión'], r.segments[k[0]].map(function (x) { return h('tr', {}, td(x.value), td(num(x.sessions), 'num'), td(pct(x.conversion_rate), 'num')); }), [1, 2])));
  });
  root.appendChild(seg);
};

var logState = { mode: 'events', name: '', session: '', offset: 0 };
views.registros = async function (root) {
  var L = logState;
  root.appendChild(h('div', { class: 'row' },
    h('button', { class: 'btn' + (L.mode === 'events' ? ' primary' : ''), onclick: function () { L.mode = 'events'; render(); } }, 'Eventos'),
    h('button', { class: 'btn' + (L.mode === 'sessions' ? ' primary' : ''), onclick: function () { L.mode = 'sessions'; render(); } }, 'Sesiones')));
  if (L.mode === 'sessions') {
    var s = await api('/admin/api/sessions?limit=200');
    if (!s.items.length) { root.appendChild(empty('Sin sesiones todavía.')); return; }
    root.appendChild(h('p', { class: 'mute small' }, s.total + ' sesiones (se muestran las 200 más recientes). Pulsa un ID para ver sus eventos.'));
    root.appendChild(table(['Inicio', 'Sesión', 'Eventos', 'Variante', 'Dispositivo', 'Origen', 'Compra', 'Herramientas mostradas', 'Recorrido'], s.items.map(function (x) {
      return h('tr', {}, td(when(x.start)), td(h('a', { class: 'lnk mono', onclick: function () { L.mode = 'events'; L.session = x.id; L.offset = 0; render(); } }, x.id)),
        td(x.events, 'num'), td(x.variant || '—'), td(x.device), td(x.source),
        td(x.converted ? h('span', { class: 'chip ok' }, '✓ ' + num(x.revenue)) : '—'),
        h('td', { class: 'wrap' }, x.tools_shown.map(function (t) { return h('span', { class: 'chip mono' }, t); })),
        h('td', { class: 'wrap small' }, x.path.map(lab).join(' → ')));
    }), [2]));
    return;
  }
  var qs = '?limit=100&offset=' + L.offset + '&name=' + encodeURIComponent(L.name) + '&session=' + encodeURIComponent(L.session);
  var d = await api('/admin/api/events' + qs);
  var sel = h('select', { onchange: function () { L.name = this.value; L.offset = 0; render(); } }, h('option', { value: '' }, 'Todos los eventos'),
    d.names.map(function (n) { var o = h('option', { value: n }, n); if (n === L.name) o.selected = true; return o; }));
  var ses = h('input', { placeholder: 'ID de sesión', value: L.session, onchange: function () { L.session = this.value.trim(); L.offset = 0; render(); } });
  root.appendChild(h('div', { class: 'row' }, sel, ses, L.session || L.name ? h('button', { class: 'btn', onclick: function () { L.name = ''; L.session = ''; L.offset = 0; render(); } }, 'Quitar filtros') : null,
    h('span', { class: 'mute small' }, num(d.total) + ' eventos')));
  if (!d.items.length) { root.appendChild(empty('Sin eventos para este filtro.')); return; }
  root.appendChild(table(['Fecha', 'Sesión', 'Evento', 'Página', 'URL', 'Propiedades'], d.items.map(function (e) {
    return h('tr', {}, td(when(e.ts)), td(h('a', { class: 'lnk mono', onclick: function () { L.session = e.session_id; L.offset = 0; render(); } }, e.session_id)),
      td(h('span', { class: 'chip' + (/^cro_/.test(e.name) ? ' lever' : '') }, e.name)), td(e.page_type), td(e.url, 'mono'),
      h('td', { class: 'wrap mono small' }, Object.keys(e.props).length ? JSON.stringify(e.props) : ''));
  })));
  root.appendChild(h('div', { class: 'row', style: 'margin-top:10px' },
    h('button', { class: 'btn', disabled: L.offset === 0 ? '' : false, onclick: function () { L.offset = Math.max(0, L.offset - 100); render(); } }, '← Más recientes'),
    h('button', { class: 'btn', disabled: L.offset + 100 >= d.total ? '' : false, onclick: function () { L.offset += 100; render(); } }, 'Más antiguos →'),
    h('span', { class: 'mute small' }, (L.offset + 1) + '–' + Math.min(L.offset + 100, d.total))));
};

// ---------- app ----------
var TABS = [['resumen', 'Resumen'], ['herramientas', 'Herramientas CRO'], ['informe', 'Informe de lo aprendido'], ['registros', 'Registros']];
function current() { var t = location.hash.slice(1); return views[t] ? t : 'resumen'; }
async function render() {
  var tab = current(), root = document.getElementById('view');
  var nav = document.getElementById('nav'); nav.textContent = '';
  TABS.forEach(function (t) { nav.appendChild(h('button', { class: t[0] === tab ? 'on' : '', onclick: function () { location.hash = t[0]; } }, t[1])); });
  var fresh = h('div', {});
  try { await views[tab](fresh); } catch (e) { fresh.appendChild(h('div', { class: 'card err' }, 'No se pudo cargar: ' + e.message)); }
  root.textContent = ''; root.appendChild(fresh);
  document.getElementById('updated').textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-ES');
}
window.addEventListener('hashchange', render);
document.getElementById('refresh').addEventListener('click', render);
setInterval(function () {
  var a = document.activeElement;
  if (!editing && current() !== 'informe' && !(a && /INPUT|SELECT/.test(a.tagName))) render();
}, 15000);
render();
</script>
